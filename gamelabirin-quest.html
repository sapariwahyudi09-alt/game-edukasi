<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Labirin Quest TKJ - Komponen Komputer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: radial-gradient(circle at center, #1a1a3e 0%, #0a0a1e 100%);
    color: #fff;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  h1 {
    color: #00ffcc;
    text-shadow: 0 0 10px #00ffcc;
    margin-bottom: 10px;
    font-size: 24px;
  }
  #gameContainer {
    position: relative;
    border: 3px solid #00ffcc;
    box-shadow: 0 0 20px #00ffcc, inset 0 0 20px rgba(0,255,204,0.2);
    border-radius: 8px;
    background: #000;
  }
  canvas { display:block; border-radius: 5px; }
  #questionBox {
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    border: 2px solid #ffcc00;
    padding: 10px 20px;
    border-radius: 8px;
    max-width: 80%;
    text-align: center;
    font-size: 14px;
    color: #ffcc00;
    text-shadow: 0 0 5px #ffcc00;
    z-index: 10;
  }
  #hud {
    position: absolute;
    top: 10px; left: 10px;
    background: rgba(0,0,0,0.7);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    color: #00ffcc;
    z-index: 10;
  }
  #controls {
    margin-top: 10px;
    font-size: 12px;
    color: #aaa;
    text-align: center;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    border-radius: 5px;
  }
  #overlay h2 { color: #00ffcc; margin-bottom: 20px; font-size: 28px; }
  #overlay p { margin: 6px 0; color: #ddd; }
  #overlay button {
    margin-top: 20px;
    padding: 12px 30px;
    background: #00ffcc;
    color: #000;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
    font-family: inherit;
  }
  #overlay button:hover { background: #fff; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<h1>🎮 LABIRIN QUEST TKJ 🎮</h1>
<div id="gameContainer">
  <canvas id="game" width="780" height="540"></canvas>
  <div id="hud">Skor: <span id="score">0</span> | Nyawa: <span id="lives">3</span></div>
  <div id="questionBox">Memuat soal...</div>
  <div id="overlay">
    <h2>Labirin Quest TKJ</h2>
    <p>Jawab pertanyaan tentang komponen komputer!</p>
    <p>Gunakan ⬆️⬇️⬅️➡️ atau WASD untuk bergerak.</p>
    <p>Pilih area jawaban yang benar, hindari monster 👾!</p>
    <button id="startBtn">MULAI BERMAIN</button>
  </div>
</div>
<div id="controls">Kontrol: Arrow Keys / WASD | M: Mute Musik</div>

<script>
// ============ SOAL TKJ ============
const QUESTIONS = [
  { q: "Komponen yang berfungsi sebagai otak komputer adalah?", opts: ["RAM","CPU","HDD","VGA"], ans: 1 },
  { q: "Memory sementara yang kehilangan data saat komputer dimatikan?", opts: ["ROM","HDD","RAM","SSD"], ans: 2 },
  { q: "Komponen yang menyimpan data secara permanen?", opts: ["CPU","RAM","HDD","Cache"], ans: 2 },
  { q: "Papan sirkuit utama tempat semua komponen terhubung?", opts: ["Motherboard","Keyboard","Monitor","PSU"], ans: 0 },
  { q: "Komponen yang mengubah arus AC menjadi DC untuk PC?", opts: ["UPS","PSU","Stabilizer","Inverter"], ans: 1 },
  { q: "Kartu yang mengolah tampilan grafis ke monitor?", opts: ["Sound Card","LAN Card","VGA Card","TV Card"], ans: 2 },
  { q: "Perangkat jaringan untuk menghubungkan komputer dalam LAN?", opts: ["Switch","Modem","Router","Hub"], ans: 0 },
  { q: "Kabel jaringan yang menggunakan konektor RJ-45?", opts: ["Coaxial","Fiber Optic","UTP","HDMI"], ans: 2 },
  { q: "Alat untuk mengukur jaringan kabel UTP?", opts: ["Multimeter","Crimping","Cable Tester","Tone Generator"], ans: 2 },
  { q: "Topologi jaringan di mana semua komputer terhubung ke satu kabel pusat?", opts: ["Star","Ring","Bus","Mesh"], ans: 2 },
  { q: "Protokol utama yang digunakan di internet?", opts: ["FTP","HTTP","TCP/IP","SMTP"], ans: 2 },
  { q: "Perangkat yang menerjemahkan IP privat ke IP publik?", opts: ["Switch","Router","Repeater","Hub"], ans: 1 },
];

// ============ MAZE (1 = wall, 0 = floor, 2 = answer zone) ============
const COLS = 26, ROWS = 18, TILE = 30;
// Maze sederhana dengan 4 zona jawaban di pojok
const MAZE = [
  "11111111111111111111111111",
  "10000000000000000000000001",
  "10222000111111111111000220",
  "10222000100000000001000220",
  "10000000101111111101000000",
  "11111000101000000101000111",
  "10000000101000000101000000",
  "10111111101000000101111110",
  "10100000000000000000000010",
  "10100011111111111111100010",
  "10100010000000000000100010",
  "10100010000000000000100010",
  "10100011111111111111100010",
  "10100000000000000000000010",
  "10111111101000000101111110",
  "10000000101000000101000000",
  "10222000101111111101000220",
  "11111111111111111111111111",
];
// Zona jawaban di 4 pojok (area 3x3)
const ZONES = [
  { x:1, y:2,  w:3, h:3, color:"#ff6b6b", label:"A" },
  { x:22,y:2,  w:3, h:3, color:"#4ecdc4", label:"B" },
  { x:1, y:15, w:3, h:3, color:"#ffe66d", label:"C" },
  { x:22,y:15, w:3, h:3, color:"#a78bfa", label:"D" },
];

// ============ GAME STATE ============
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const questionBox = document.getElementById('questionBox');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');

let player, monsters, particles, currentQ, score, lives, answeredZones, wrongZones, gameRunning, keys = {};
let musicOn = true;

// ============ AUDIO ============
let audioCtx, musicGain, musicTimer;
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  musicGain = audioCtx.createGain();
  musicGain.gain.value = 0.08;
  musicGain.connect(audioCtx.destination);
  startMusic();
}
function startMusic() {
  // Melodi instrumental sederhana (arpeggio minor)
  const notes = [220, 261.63, 329.63, 392, 329.63, 261.63, 220, 196];
  let i = 0;
  function playNote() {
    if (!musicOn || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = notes[i % notes.length];
    g.gain.setValueAtTime(0, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc.connect(g); g.connect(musicGain);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.45);
    i++;
    musicTimer = setTimeout(playNote, 400);
  }
  playNote();
}
function sfx(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  if (type === 'correct') {
    [523.25, 659.25, 783.99].forEach((f, idx) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, now + idx*0.1);
      g.gain.linearRampToValueAtTime(0.3, now + idx*0.1 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + idx*0.1 + 0.3);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now + idx*0.1); o.stop(now + idx*0.1 + 0.35);
    });
  } else if (type === 'wrong') {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(200, now);
    o.frequency.exponentialRampToValueAtTime(50, now + 0.4);
    g.gain.setValueAtTime(0.3, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(now + 0.4);
  } else if (type === 'hit') {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(400, now);
    o.frequency.exponentialRampToValueAtTime(80, now + 0.3);
    g.gain.setValueAtTime(0.25, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(now + 0.3);
  }
}

// ============ GAME LOGIC ============
function resetPlayer() {
  player = {
    x: 13 * TILE + TILE/2,
    y: 9 * TILE + TILE/2,
    r: 10,
    speed: 2.2,
    invuln: 0
  };
}
function spawnMonsters() {
  monsters = [];
  const spots = [[5,5],[20,5],[5,12],[20,12],[13,3],[13,14]];
  for (let i = 0; i < 3; i++) {
    const s = spots[i];
    monsters.push({
      x: s[0]*TILE + TILE/2,
      y: s[1]*TILE + TILE/2,
      r: 12,
      speed: 1.4,
      dir: { x: 1, y: 0 },
      changeTimer: 0,
      color: `hsl(${Math.random()*360}, 70%, 50%)`
    });
  }
}
function isWall(px, py) {
  const col = Math.floor(px / TILE);
  const row = Math.floor(py / TILE);
  if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return true;
  return MAZE[row][col] === '1';
}
function canMove(nx, ny, r) {
  return !isWall(nx-r, ny-r) && !isWall(nx+r, ny-r) &&
         !isWall(nx-r, ny+r) && !isWall(nx+r, ny+r);
}

function nextQuestion() {
  if (currentQ >= QUESTIONS.length) {
    endGame(true);
    return;
  }
  const q = QUESTIONS[currentQ];
  questionBox.textContent = `Soal ${currentQ+1}/${QUESTIONS.length}: ${q.q}`;
  answeredZones = new Set();
  wrongZones = new Set();
  // Assign jawaban ke zona
  const indices = [0,1,2,3];
  // Shuffle
  for (let i = indices.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  // indices[k] = zona mana yang berisi opsi ke-k
  // Kita simpan mapping: zoneIdx -> optionIdx
  window.zoneOptionMap = {};
  for (let k = 0; k < 4; k++) {
    window.zoneOptionMap[indices[k]] = k;
  }
  // Label zona A,B,C,D sesuai urutan indices
  for (let k = 0; k < 4; k++) {
    ZONES[indices[k]].optionIdx = k;
  }
  resetPlayer();
  spawnMonsters();
}

function checkZoneCollision() {
  for (let i = 0; i < 4; i++) {
    const z = ZONES[i];
    if (answeredZones.has(i)) continue;
    const zx = z.x * TILE, zy = z.y * TILE;
    const zw = z.w * TILE, zh = z.h * TILE;
    if (player.x > zx && player.x < zx+zw && player.y > zy && player.y < zy+zh) {
      const optIdx = z.optionIdx;
      const q = QUESTIONS[currentQ];
      if (optIdx === q.ans) {
        // BENAR
        answeredZones.add(i);
        score += 100;
        scoreEl.textContent = score;
        sfx('correct');
        spawnFireworks(player.x, player.y, z.color);
        spawnCheckmark(zx + zw/2, zy + zh/2);
        setTimeout(() => {
          currentQ++;
          nextQuestion();
        }, 1500);
      } else {
        // SALAH
        wrongZones.add(i);
        sfx('wrong');
        spawnBomb(zx + zw/2, zy + zh/2);
        spawnX(zx + zw/2, zy + zh/2);
      }
      return;
    }
  }
}

function checkMonsterCollision() {
  if (player.invuln > 0) return;
  for (const m of monsters) {
    const dx = m.x - player.x, dy = m.y - player.y;
    if (Math.hypot(dx, dy) < m.r + player.r) {
      lives--;
      livesEl.textContent = lives;
      sfx('hit');
      spawnBomb(player.x, player.y);
      if (lives <= 0) {
        endGame(false);
      } else {
        player.invuln = 90;
        resetPlayer();
      }
      return;
    }
  }
}

// ============ PARTICLES ============
particles = [];
function spawnFireworks(x, y, color) {
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 2 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 60, maxLife: 60,
      color, type: 'spark',
      size: 3 + Math.random()*3
    });
  }
}
function spawnBomb(x, y) {
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 50, maxLife: 50,
      color: `hsl(${Math.random()*40}, 100%, 50%)`,
      type: 'smoke',
      size: 5 + Math.random()*6
    });
  }
}
function spawnCheckmark(x, y) {
  particles.push({ x, y, life: 90, maxLife: 90, type: 'check' });
}
function spawnX(x, y) {
  particles.push({ x, y, life: 60, maxLife: 60, type: 'x' });
}
function updateParticles() {
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.life--;
    if (p.type === 'spark' || p.type === 'smoke') {
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.95; p.vy *= 0.95;
      p.vy += 0.05;
    }
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ============ MONSTER AI ============
function updateMonsters() {
  for (const m of monsters) {
    m.changeTimer--;
    if (m.changeTimer <= 0) {
      // Pilih arah random yang valid
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      const valid = dirs.filter(d => {
        const nx = m.x + d[0]*TILE;
        const ny = m.y + d[1]*TILE;
        return !isWall(nx, ny);
      });
      if (valid.length > 0) {
        const d = valid[Math.floor(Math.random()*valid.length)];
        m.dir = { x: d[0], y: d[1] };
      }
      m.changeTimer = 30 + Math.floor(Math.random()*60);
    }
    const nx = m.x + m.dir.x * m.speed;
    const ny = m.y + m.dir.y * m.speed;
    if (canMove(nx, ny, m.r - 2)) {
      m.x = nx; m.y = ny;
    } else {
      m.changeTimer = 0; // ganti arah
    }
  }
}

// ============ RENDER ============
function drawMaze() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ch = MAZE[r][c];
      if (ch === '1') {
        ctx.fillStyle = '#2a2a5e';
        ctx.fillRect(c*TILE, r*TILE, TILE, TILE);
        ctx.strokeStyle = '#4a4a8e';
        ctx.lineWidth = 1;
        ctx.strokeRect(c*TILE, r*TILE, TILE, TILE);
      } else {
        ctx.fillStyle = '#0d0d24';
        ctx.fillRect(c*TILE, r*TILE, TILE, TILE);
      }
    }
  }
}
function drawZones() {
  for (let i = 0; i < 4; i++) {
    const z = ZONES[i];
    const zx = z.x * TILE, zy = z.y * TILE;
    const zw = z.w * TILE, zh = z.h * TILE;
    const answered = answeredZones.has(i);
    const wrong = wrongZones.has(i);
    
    ctx.save();
    if (answered) {
      ctx.fillStyle = 'rgba(0,255,100,0.3)';
      ctx.strokeStyle = '#00ff66';
    } else if (wrong) {
      ctx.fillStyle = 'rgba(255,50,50,0.2)';
      ctx.strokeStyle = '#ff3333';
    } else {
      ctx.fillStyle = z.color + '33';
      ctx.strokeStyle = z.color;
    }
    ctx.lineWidth = 3;
    ctx.fillRect(zx, zy, zw, zh);
    ctx.strokeRect(zx, zy, zw, zh);
    
    // Label zona
    ctx.fillStyle = answered ? '#00ff66' : (wrong ? '#ff3333' : z.color);
    ctx.font = 'bold 20px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(z.label, zx + zw/2, zy + 15);
    
    // Teks opsi
    const optIdx = z.optionIdx;
    if (optIdx !== undefined) {
      const q = QUESTIONS[currentQ];
      ctx.font = '11px Courier New';
      ctx.fillStyle = answered ? '#00ff66' : '#fff';
      const text = q.opts[optIdx];
      // Word wrap sederhana
      const words = text.split(' ');
      let line = '', ly = zy + 35;
      for (const w of words) {
        const test = line + w + ' ';
        if (ctx.measureText(test).width > zw - 10) {
          ctx.fillText(line.trim(), zx + zw/2, ly);
          line = w + ' ';
          ly += 14;
        } else {
          line = test;
        }
      }
      ctx.fillText(line.trim(), zx + zw/2, ly);
    }
    ctx.restore();
  }
}
function drawPlayer() {
  if (player.invuln > 0 && Math.floor(player.invuln/5) % 2 === 0) return;
  ctx.save();
  ctx.fillStyle = '#00ffcc';
  ctx.shadowColor = '#00ffcc';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
  ctx.fill();
  // Mata
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(player.x - 3, player.y - 2, 2, 0, Math.PI*2);
  ctx.arc(player.x + 3, player.y - 2, 2, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}
function drawMonsters() {
  for (const m of monsters) {
    ctx.save();
    ctx.fillStyle = m.color;
    ctx.shadowColor = m.color;
    ctx.shadowBlur = 12;
    // Tubuh monster
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r, Math.PI, 0);
    ctx.lineTo(m.x + m.r, m.y + m.r);
    // Kaki bergelombang
    const waves = 4;
    for (let i = 0; i < waves; i++) {
      const x1 = m.x + m.r - (i*2+1) * (m.r*2/(waves*2));
      const x2 = m.x + m.r - (i*2+2) * (m.r*2/(waves*2));
      ctx.quadraticCurveTo((x1+x2)/2, m.y + m.r - 5, x2, m.y + m.r);
    }
    ctx.closePath();
    ctx.fill();
    // Mata
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(m.x - 4, m.y - 2, 3, 0, Math.PI*2);
    ctx.arc(m.x + 4, m.y - 2, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(m.x - 4 + m.dir.x, m.y - 2 + m.dir.y, 1.5, 0, Math.PI*2);
    ctx.arc(m.x + 4 + m.dir.x, m.y - 2 + m.dir.y, 1.5, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}
function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.save();
    if (p.type === 'spark') {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI*2);
      ctx.fill();
    } else if (p.type === 'smoke') {
      ctx.globalAlpha = alpha * 0.7;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    } else if (p.type === 'check') {
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#00ff66';
      ctx.lineWidth = 6;
      ctx.shadowColor = '#00ff66';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.moveTo(p.x - 25, p.y);
      ctx.lineTo(p.x - 5, p.y + 20);
      ctx.lineTo(p.x + 25, p.y - 20);
      ctx.stroke();
    } else if (p.type === 'x') {
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#ff3333';
      ctx.lineWidth = 6;
      ctx.shadowColor = '#ff3333';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.moveTo(p.x - 20, p.y - 20);
      ctx.lineTo(p.x + 20, p.y + 20);
      ctx.moveTo(p.x + 20, p.y - 20);
      ctx.lineTo(p.x - 20, p.y + 20);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ============ UPDATE ============
function update() {
  if (!gameRunning) return;
  // Movement player
  let dx = 0, dy = 0;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= 1;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += 1;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
  if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }
  const nx = player.x + dx * player.speed;
  const ny = player.y + dy * player.speed;
  if (canMove(nx, player.y, player.r)) player.x = nx;
  if (canMove(player.x, ny, player.r)) player.y = ny;
  
  if (player.invuln > 0) player.invuln--;
  
  updateMonsters();
  updateParticles();
  checkZoneCollision();
  checkMonsterCollision();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawMaze();
  drawZones();
  drawMonsters();
  drawPlayer();
  drawParticles();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// ============ GAME FLOW ============
function startGame() {
  initAudio();
  score = 0; lives = 3; currentQ = 0;
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  particles = [];
  overlay.classList.add('hidden');
  gameRunning = true;
  nextQuestion();
}
function endGame(win) {
  gameRunning = false;
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h2>${win ? '🏆 SELAMAT! 🏆' : '💀 GAME OVER 💀'}</h2>
    <p>${win ? 'Kamu menyelesaikan semua soal!' : 'Nyawa habis!'}</p>
    <p>Skor Akhir: <strong style="color:#00ffcc">${score}</strong></p>
    <p>Soal terjawab: ${currentQ} / ${QUESTIONS.length}</p>
    <button id="restartBtn">MAIN LAGI</button>
  `;
  document.getElementById('restartBtn').onclick = startGame;
}

// ============ INPUT ============
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'm' || e.key === 'M') {
    musicOn = !musicOn;
    if (musicGain) musicGain.gain.value = musicOn ? 0.08 : 0;
  }
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
startBtn.onclick = startGame;

loop();
</script>
</body>
</html>
